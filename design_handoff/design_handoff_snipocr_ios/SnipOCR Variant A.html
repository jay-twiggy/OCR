<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SnipOCR — iOS 26 리디자인 (A안)</title>
<link rel="stylesheet" href="assets/colors_and_type.css">
<style>
  html, body { margin:0; background:#f0eee9; font-family: var(--font-sf); }
  body { padding: 0; width: 1228px; }
  #root { padding: 24px; box-sizing: border-box; width: 1228px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ocrPulse {
    0%,100% { box-shadow: 0 0 0 0 transparent; opacity: .6; }
    50% { box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent); opacity: 1; }
  }
  @keyframes ctaGlow {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.08); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="snipocr-shared.jsx"></script>
<script type="text/babel" src="variant-classic.jsx"></script>

<script type="text/babel">
const TWEAKS = {
  tint: "#007AFF",
  background: "gradient",
  toolbarDensity: "labels",
  translationPos: "bottom",
};

ReactDOM.createRoot(document.getElementById("root")).render(<VariantClassic tweaks={TWEAKS}/>);
</script>
</body>
</html>
